name: ShellForge build

on:
  push:
    branches:
      - main
      - feature/shellforge-enhancements
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev
      - name: Build ShellForge
        run: make clean all
